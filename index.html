<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>إدارة الكوكيز</title>
  <meta name="description" content="إدارة الطلبات والمخزون والمصاريف والأرباح لمشروع الكوكيز">
  <meta name="theme-color" content="#FFF8F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1517" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="الكوكيز">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <a class="brand" href="#home">
        <img src="icons/icon.svg" alt="" width="34" height="34">
        <span id="brand-name">كوكيز هوم ميد</span>
      </a>
      <button class="icon-btn bell" id="bell" data-action="alerts" aria-label="تنبيهات المخزون">
        <span class="ic-slot"></span>
        <span class="bell-badge" id="bell-badge" hidden></span>
      </button>
    </header>

    <nav class="nav" id="nav" aria-label="الأقسام"></nav>

    <main id="view" tabindex="-1"></main>
  </div>

  <button class="fab" id="fab" hidden></button>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="icon-btn" data-action="close-sheet" aria-label="إغلاق" id="sheet-close"></button>
      </header>
      <div class="sheet-body" id="sheet-body"></div>
      <footer class="sheet-foot" id="sheet-foot"></footer>
    </div>
  </div>

  <div class="dialog" id="dialog" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input type="file" id="import-file" hidden>

  <script src="app.js"></script>
</body>
</html>
